app = "parentpilot-app"
primary_region = "sin"

[build]

[env]
  PORT = "8000"
  DEV_MODE = "true"
  DATABASE_URL = "sqlite+aiosqlite:///./parentpilot.db"
  REDIS_URL = "fake://"
  JWT_SECRET = "change-me-in-fly-secrets"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
